name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: skill frontmatter is valid
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          KEY = re.compile(r"^([a-z_]+):(.*)$")
          fail = []

          def unquote(raw, where):
              value = raw.strip()
              if value[:1] in ('"', "'"):
                  if len(value) < 2 or value[-1] != value[0]:
                      fail.append(f"{where}: unbalanced quoting in the value")
                      return value
                  return value[1:-1]
              return value

          for folder in sorted(pathlib.Path("skills").iterdir()):
              if not folder.is_dir():
                  continue
              path = folder / "SKILL.md"
              if not path.exists():
                  fail.append(f"{folder}: no SKILL.md")
                  continue
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0].strip() != "---":
                  fail.append(f"{path}: no frontmatter")
                  continue
              try:
                  end = lines.index("---", 1)
              except ValueError:
                  fail.append(f"{path}: frontmatter is never closed")
                  continue

              keys = {}
              for line in lines[1:end]:
                  match = KEY.match(line)
                  if match:
                      keys[match.group(1)] = match.group(2)

              for required in ("name", "description", "license", "metadata"):
                  if required not in keys:
                      fail.append(f"{path}: missing '{required}'")

              if "name" in keys and unquote(keys["name"], path) != folder.name:
                  fail.append(f"{path}: name does not match folder '{folder.name}'")

              if "description" in keys:
                  description = unquote(keys["description"], path)
                  if not description:
                      fail.append(f"{path}: empty description — the agent has nothing to trigger on")
                  elif len(description) > 1024:
                      fail.append(f"{path}: description is {len(description)} chars (max 1024)")

          print("\n".join(fail) if fail else "frontmatter OK")
          sys.exit(1 if fail else 0)
          PY

      - name: skill count matches every catalog
        run: |
          skills=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          readme=$(grep -c '^| \[awesome-' README.md)
          llms=$(grep -c '^- \[awesome-' llms.txt)
          claim=$(grep -oE 'symlinks all [0-9]+ skills' README.md | grep -oE '[0-9]+')
          echo "skills/=$skills README table=$readme llms.txt=$llms README claim=$claim"
          [ "$skills" = "$readme" ] && [ "$skills" = "$llms" ] && [ "$skills" = "$claim" ]

      - name: code fences are balanced
        run: |
          status=0
          for f in $(git ls-files '*.md'); do
            n=$(grep -c '^```' "$f" || true)
            [ $((n % 2)) -eq 0 ] || { echo "$f: unbalanced code fences ($n)"; status=1; }
          done
          exit $status

      # Only catalogue links are checked: SKILL.md bodies quote example markdown
      # (`[x](url)`, `sandbox:/mnt/data/…`) that a general link checker would flag.
      - name: catalogue links point at real skills
        run: |
          status=0
          for target in $(grep -ohE 'skills/awesome-[a-z0-9-]+' README.md llms.txt | sort -u); do
            [ -d "$target" ] || { echo "catalogue references missing skill: $target"; status=1; }
          done
          exit $status

      # Partial guard for the "Framework- and stack-agnostic" rule in CONTRIBUTING.
      # Only the mechanical half is checkable: a skill whose worked examples are all
      # in one language must also carry the per-language mapping the rule requires.
      # The other half (description not claiming wider coverage than the body
      # delivers, vendor tooling naming its alternative) stays a review check.
      - name: single-language skills carry a per-language mapping
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          LANGS = {"typescript","ts","javascript","js","jsx","tsx","python","py","go","golang",
                   "rust","rs","java","kotlin","csharp","cs","ruby","rb","php","swift","cpp","c"}
          # The structural form CONTRIBUTING prescribes: a heading or a bold lead,
          # not the phrase buried in a sentence.
          MARKER = re.compile(r"^(#{1,6} |[-*] )?\*{0,2}other (languages|runtimes|ecosystems|stacks|frameworks)\*{0,2}", re.I | re.M)
          THRESHOLD = 3   # one or two worked examples may sit in a single language

          fail = []
          for folder in sorted(pathlib.Path("skills").iterdir()):
              if not folder.is_dir():
                  continue
              seen, text = {}, ""
              for path in [folder / "SKILL.md"] + sorted((folder / "references").glob("*.md")):
                  if not path.exists():
                      continue
                  body = path.read_text(encoding="utf-8")
                  text += body
                  for lang in re.findall(r"^```([A-Za-z+#]+)", body, re.M):
                      lang = lang.lower()
                      if lang in LANGS:
                          seen[lang] = seen.get(lang, 0) + 1
              total = sum(seen.values())
              if total >= THRESHOLD and len(seen) == 1 and not MARKER.search(text):
                  only = next(iter(seen))
                  fail.append(
                      f"{folder.name}: {total} code examples, all {only}, and no per-language mapping. "
                      f"Add an 'Other languages'/'Other runtimes' block per CONTRIBUTING "
                      f"(Framework- and stack-agnostic), or drop to fewer than {THRESHOLD} examples."
                  )

          print("\n".join(fail) if fail else "stack-agnostic OK")
          sys.exit(1 if fail else 0)
          PY

      - name: humanize-en marker regexes still match their fixtures
        run: python3 skills/awesome-humanize-en/scripts/check_markers.py
