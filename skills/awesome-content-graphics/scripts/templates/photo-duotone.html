<div class="{{headClass}}" data-mark="headline" data-effect="{{effect}}" data-max-h="{{headMaxH}}" data-center="{{headCenter}}" style="top:{{headTop}}%">{{headLines}}</div>
<div data-mark="photo" class="duo" style="position:absolute;left:6%;top:{{photoTop}}%;width:88%;height:{{photoH}}%;border-radius:{{radius}}px;overflow:hidden">
  <div class="photo full" style="background-image:url({{photoData}});background-position:{{focus}};filter:grayscale(1) contrast(1.08)"></div>
  <div style="position:absolute;inset:0;background:{{accent}};mix-blend-mode:color"></div>
  <div style="position:absolute;inset:0;background:{{bg}};mix-blend-mode:multiply;opacity:.3"></div>
</div>
