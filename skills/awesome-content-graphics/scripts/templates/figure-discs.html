<div class="{{headClass}}" data-mark="headline" data-effect="{{effect}}" data-max-h="{{headMaxH}}" data-center="{{headCenter}}" style="top:{{headTop}}%">{{headLines}}</div>
<div data-mark="figure" data-figure style="position:absolute;left:6%;top:{{figTop}}%;width:88%;height:{{figH}}%;display:flex;align-items:flex-end;justify-content:center;gap:6%">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div data-value style="font-size:{{valueSize}}px;font-weight:800;line-height:1;margin-bottom:{{capGap}}px">{{valueA}}</div>
    <div data-mark="form" style="width:{{dA}}px;height:{{dA}}px;border-radius:50%;background:{{accent}}"></div>
    <div class="cap" data-caption style="margin-top:{{capGap}}px">{{labelA}}</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center">
    <div data-value style="font-size:{{valueSize}}px;font-weight:800;line-height:1;margin-bottom:{{capGap}}px">{{valueB}}</div>
    <div data-mark="form" style="width:{{dB}}px;height:{{dB}}px;border-radius:50%;background:{{muted}}"></div>
    <div class="cap" data-caption style="margin-top:{{capGap}}px">{{labelB}}</div>
  </div>
</div>
