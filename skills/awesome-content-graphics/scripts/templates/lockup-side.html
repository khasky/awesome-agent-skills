<div data-mark="figure" data-figure style="position:absolute;left:6%;top:{{figTop}}%;width:46%;height:{{figH}}%;display:flex;flex-direction:column;justify-content:center">
  <div data-value data-mark="value" style="font-size:{{valueSize}}px;font-weight:800;line-height:1.05;letter-spacing:-.05em;color:{{accent}};white-space:nowrap">{{value}}</div>
  <div class="cap" data-caption style="margin-top:{{capGap}}px;max-width:95%">{{caption}}</div>
</div>
<div class="{{headClass}}" data-mark="headline" data-effect="{{effect}}" data-max-h="{{headMaxH}}" data-center="{{headCenter}}" style="left:56%;width:38%;top:{{headTop}}%">{{headLines}}</div>
