<div class="{{headClass}}" data-mark="headline" data-effect="{{effect}}" data-max-h="{{headMaxH}}" data-center="{{headCenter}}" style="top:{{headTop}}%">{{headLines}}</div>
<div data-mark="figure" data-figure style="position:absolute;left:6%;top:{{figTop}}%;width:88%;height:{{figH}}%;display:flex;align-items:center;justify-content:space-between">
  <div><div data-value data-mark="value" style="font-size:{{valueSize}}px;font-weight:800;line-height:1.05;letter-spacing:-.04em;color:{{accent}}">{{valueA}}</div><div class="cap" data-caption style="margin-top:{{capGap}}px">{{labelA}}</div></div>
  <div style="font-size:{{vsSize}}px;font-weight:400;color:{{muted}};line-height:1">vs</div>
  <div style="text-align:right"><div data-value data-mark="value-b" style="font-size:{{valueSize}}px;font-weight:800;line-height:1.05;letter-spacing:-.04em;color:{{muted}}">{{valueB}}</div><div class="cap" data-caption style="margin-top:{{capGap}}px">{{labelB}}</div></div>
</div>
