<div class="{{headClass}}" data-mark="headline" data-effect="{{effect}}" data-max-h="{{headMaxH}}" data-center="{{headCenter}}" style="top:{{headTop}}%">{{headLines}}</div>
<div data-mark="photo" style="position:absolute;left:12%;top:{{frameTop}}%;width:76%;height:{{frameH}}%;border:{{bezel}}px solid {{fg}};border-radius:{{radius}}px;background:#000;overflow:hidden;box-sizing:border-box"><div class="photo full" style="background-image:url({{photoData}});background-position:{{focus}}"></div></div>
<div data-mark="stand" style="position:absolute;left:38%;top:{{standTop}}%;width:24%;height:{{standH}}px;background:{{fg}};border-radius:{{standH}}px"></div>
