<div class="{{headClass}}" data-mark="headline" data-effect="{{effect}}" data-max-h="{{headMaxH}}" data-center="{{headCenter}}" style="top:{{headTop}}%">{{headLines}}</div>
<div data-mark="photo" style="position:absolute;left:6%;top:{{photoTop}}%;width:88%;height:{{photoH}}%;border-radius:{{radius}}px;overflow:hidden"><div class="photo full" style="background-image:url({{photoData}});background-position:{{focus}}"></div></div>
<div data-mark="note" class="cap" style="position:absolute;left:6%;width:88%;top:{{noteTop}}%;text-transform:none;letter-spacing:0;font-size:{{noteSize}}px;line-height:1.3;color:{{fg}};font-weight:600">{{note}}</div>
