<div class="{{headClass}}" data-mark="headline" data-effect="{{effect}}" data-max-h="{{headMaxH}}" data-center="{{headCenter}}" style="top:{{headTop}}%">{{headLines}}</div>
<div data-mark="photo" style="position:absolute;left:14%;top:{{cardTop}}%;width:72%;height:{{cardH}}%;transform:rotate({{tilt}}deg);border-radius:{{radius}}px;box-shadow:0 {{shadowY}}px {{shadowB}}px rgba(0,0,0,.35);overflow:hidden;background:#000"><div class="photo full" style="background-image:url({{photoData}});background-position:{{focus}}"></div></div>
