<div class="{{headClass}}" data-mark="headline" data-effect="{{effect}}" data-max-h="{{headMaxH}}" data-center="{{headCenter}}" data-bottom="{{headBottom}}" style="top:{{headTop}}%">{{headLines}}</div>
<div data-mark="figure" data-figure style="position:absolute;left:6%;top:{{figTop}}%;width:88%;height:{{figH}}%;{{figAlign}}">
  <div data-value data-mark="value" style="font-size:{{valueSize}}px;font-weight:800;line-height:1.05;letter-spacing:-.04em;color:{{accent}};white-space:nowrap;display:inline-block">{{value}}</div>
  <div class="cap" data-caption style="margin-top:{{capGap}}px">{{caption}}</div>
</div>
