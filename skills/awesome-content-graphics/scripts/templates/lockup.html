<div class="head" data-mark="headline" style="top:{{headTop}}%">{{headLines}}</div>
<div data-mark="figure" data-figure style="position:absolute;left:6%;top:{{figTop}}%;width:88%;height:{{figH}}%">
  <div data-value style="font-size:{{valueSize}}px;font-weight:800;line-height:.9;letter-spacing:-.04em;color:{{accent}};white-space:nowrap">{{value}}</div>
  <div class="cap" data-caption style="margin-top:{{capGap}}px">{{caption}}</div>
</div>
